<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10關極速密室逃脫大挑戰</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .game-container {
            width: 500px;
            height: 560px;
            background-color: #162447;
            border: 4px solid #1f4068;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            box-sizing: border-box;
            background-color: #1f4068;
            font-size: 15px;
            font-weight: bold;
        }
        .room-view {
            flex: 1;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .door {
            width: 140px;
            height: 210px;
            background-color: #e43f5a;
            border: 5px solid #b33045;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
            position: relative;
        }
        .door::after {
            content: '●';
            position: absolute;
            right: 12px;
            top: 95px;
            color: #ffd700;
            font-size: 18px;
        }
        .inventory-bar {
            width: 100%;
            height: 60px;
            background-color: #1f4068;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
            gap: 10px;
        }
        .slot {
            width: 42px;
            height: 42px;
            background-color: #162447;
            border: 2px dashed #e43f5a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        .slot.has-item {
            border-style: solid;
            border-color: #ffd700;
            background-color: #243b55;
        }
        .interactive-item {
            position: absolute;
            cursor: pointer;
            font-size: 32px;
            transition: transform 0.2s;
        }
        .interactive-item:hover {
            transform: scale(1.15);
        }
        .message-box {
            position: absolute;
            bottom: 75px;
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            color: #ffd700;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .control-panel {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        input, button {
            padding: 5px 10px;
            font-size: 13px;
            border-radius: 4px;
            border: none;
        }
        input {
            background-color: #162447;
            color: #fff;
            border: 1px solid #e43f5a;
            text-align: center;
        }
        button {
            background-color: #e43f5a;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #b33045;
        }
        .wire {
            width: 70px;
            height: 10px;
            background-color: #555;
            border-radius: 5px;
            cursor: pointer;
        }
        .wire.connected {
            background-color: #2ed573;
            box-shadow: 0 0 6px #2ed573;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <span id="roomTitle">第 1 關：數字密碼</span>
            <span id="timer">時間: 0秒</span>
        </div>

        <div class="room-view" id="roomView">
            <div class="door" id="mainDoor">門</div>
            <div id="messageBox" class="message-box" style="opacity: 0;">提示訊息</div>
        </div>

        <div class="inventory-bar" id="inventoryBar">
            <span style="font-size: 12px; color: #a0aec0; margin-right: 5px;">道具：</span>
            <div class="slot" id="slot0"></div>
            <div class="slot" id="slot1"></div>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        let seconds = 0;
        let timerInterval = null;
        let inventory = [];
        let levelState = {};

        const roomTitle = document.getElementById("roomTitle");
        const timerEl = document.getElementById("timer");
        const roomView = document.getElementById("roomView");
        const messageBox = document.getElementById("messageBox");
        const mainDoor = document.getElementById("mainDoor");

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                timerEl.innerText = `時間: ${seconds}秒`;
            }, 1000);
        }

        function showMessage(text) {
            messageBox.innerText = text;
            messageBox.style.opacity = 1;
            setTimeout(() => {
                messageBox.style.opacity = 2000;
            }, 2000);
        }

        function updateInventory() {
            for (let i = 0; i < 2; i++) {
                const slot = document.getElementById(`slot${i}`);
                slot.innerHTML = "";
                slot.classList.remove("has-item");
                if (inventory[i]) {
                    slot.innerHTML = inventory[i].icon;
                    slot.classList.add("has-item");
                }
            }
        }

        function loadLevel() {
            const oldPanel = document.getElementById("controlPanel");
            if (oldPanel) oldPanel.remove();
            
            const oldItems = document.querySelectorAll(".interactive-item");
            oldItems.forEach(el => el.remove());

            if (currentLevel === 1) {
                roomTitle.innerText = "第 1 關：數字密碼 (提示:4876)";
                mainDoor.style.display = "flex";
                createControlPanel(`
                    <input type="text" id="p1" placeholder="輸入4876" style="width:100px;">
                    <button onclick="if(document.getElementById('p1').value==='4876') nextLevel(); else showMessage('密碼錯!');">解鎖</button>
                `);

            } else if (currentLevel === 2) {
                roomTitle.innerText = "第 2 關：鑰匙解鎖";
                mainDoor.style.display = "flex";
                let key = document.createElement("div");
                key.className = "interactive-item";
                key.innerHTML = "🔑";
                key.style.right = "50px"; key.style.top = "200px";
                key.onclick = () => { inventory.push({icon:"🔑"}); updateInventory(); key.remove(); showMessage("拿到鑰匙！"); };
                roomView.appendChild(key);
                createControlPanel(`<button onclick="if(inventory.length>0) nextLevel(); else showMessage('需要鑰匙！');">用鑰匙開門</button>`);

            } else if (currentLevel === 3) {
                roomTitle.innerText = "第 3 關：倒水解謎 (提示:9527)";
                mainDoor.style.display = "flex";
                levelState.w = false;
                createControlPanel(`
                    <button onclick="levelState.w=true; showMessage('水倒入杯中，浮現9527');">倒水</button>
                    <input type="text" id="p3" placeholder="密碼" style="width:70px;">
                    <button onclick="if(levelState.w && document.getElementById('p3').value==='9527') nextLevel(); else showMessage('未倒水或密碼錯');">開門</button>
                `);

            } else if (currentLevel === 4) {
                roomTitle.innerText = "第 4 關：化學試管 (紅+藍)";
                mainDoor.style.display = "flex";
                levelState.pots = [];
                createControlPanel(`
                    <button onclick="levelState.pots.push('紅'); showMessage('加紅');">🔴紅</button>
                    <button onclick="levelState.pots.push('藍'); showMessage('加藍');">🔵藍</button>
                    <button onclick="if(levelState.pots.length===2 && levelState.pots[0]==='紅' && levelState.pots[1]==='藍') nextLevel(); else {showMessage('配方錯'); levelState.pots=[];}">混合</button>
                `);

            } else if (currentLevel === 5) {
                roomTitle.innerText = "第 5 關：接通電線";
                mainDoor.style.display = "flex";
                levelState.wires = {1:false, 2:false, 3:false};
                let panel = document.createElement("div");
                panel.id = "controlPanel"; panel.className = "control-panel";
                panel
                        } else if (currentLevel === 6) {
                roomTitle.innerText = "第 6 關：圖形對齊";
                mainDoor.style.display = "flex";
                createControlPanel(`<button onclick="nextLevel()" style="background:#2ed573;">點擊對齊齒輪，通關！</button>`);

            } else if (currentLevel === 7) {
                roomTitle.innerText = "第 7 關：雷射保全 (密碼:8888)";
                mainDoor.style.display = "flex";
                createControlPanel(`
                    <input type="text" id="p7" placeholder="8888" style="width:80px;">
                    <button onclick="if(document.getElementById('p7').value==='8888') nextLevel(); else showMessage('保全密碼錯');">解除</button>
                `);

            } else if (currentLevel === 8) {
                roomTitle.innerText = "第 8 關：旋轉密碼盤 (提示:1234)";
                mainDoor.style.display = "flex";
                createControlPanel(`
                    <input type="text" id="p8" placeholder="1234" style="width:80px;">
                    <button onclick="if(document.getElementById('p8').value==='1234') nextLevel(); else showMessage('密碼錯');">開啟</button>
                `);

            } else if (currentLevel === 9) {
                roomTitle.innerText = "第 9 關：重力平衡";
                mainDoor.style.display = "flex";
                createControlPanel(`<button onclick="nextLevel()" style="background:#2ed573;">校準重力平衡！</button>`);

            } else if (currentLevel === 10) {
                roomTitle.innerText = "第 10 關：終極逃生門 (密碼:0000)";
                mainDoor.style.display = "flex";
                createControlPanel(`
                    <input type="text" id="p10" placeholder="0000" style="width:80px;">
                    <button onclick="if(document.getElementById('p10').value==='0000') nextLevel(); else showMessage('最終密碼錯');">逃脫！</button>
                `);
            } else {
                endGame();
            }
        }

        function createControlPanel(html) {
            let p = document.createElement("div");
            p.id = "controlPanel"; p.className = "control-panel";
            p.innerHTML = html;
            roomView.appendChild(p);
        }

        function nextLevel() {
            showMessage("過關！");
            currentLevel++;
            setTimeout(loadLevel, 400);
        }

        function endGame() {
            clearInterval(timerInterval);
            mainDoor.style.display = "none";
            
            // 20秒內破關直接拿金獎杯 (小於等於20秒給 100 分)
            let score = seconds <= 20 ? 100 : Math.max(10, 100 - (seconds - 20) * 3);
            let rankEmoji = seconds <= 20 ? "🏆" : (seconds <= 40 ? "🥈" : "🥉");
            let rankTitle = seconds <= 20 ? "黃金小獎杯 (閃電極速王)" : "銀牌逃脫者";

            roomTitle.innerText = "10關全部通關！";
            roomView.innerHTML = `
                <div style="text-align: center;">
                    <div style="font-size: 55px; margin-bottom: 5px;">${rankEmoji}</div>
                    <h3 style="color: #ffd700; margin: 5px 0;">${rankTitle}</h3>
                    <p style="font-size: 15px; color: #cbd5e0; margin: 8px 0;">總耗時：${seconds} 秒</p>
                    <p style="font-size: 16px; color: #fff; font-weight: bold;">最終得分：${score} 分</p>
                    <button onclick="location.reload()" style="margin-top: 10px;">再玩一次</button>
                </div>
            `;
            document.getElementById("inventoryBar").style.display = "none";
        }

        startTimer();
        loadLevel();
    </script>
</body>
</html>
